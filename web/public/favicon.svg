<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5b7"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fdff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- motion swoosh lines -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round">
    <line x1="70" y1="260" x2="150" y2="260"/>
    <line x1="60" y1="300" x2="160" y2="300"/>
    <line x1="80" y1="340" x2="140" y2="340"/>
  </g>

  <!-- runner silhouette -->
  <g fill="url(#fig)">
    <!-- head -->
    <circle cx="330" cy="118" r="30"/>

    <!-- torso, leaning forward -->
    <path d="M300,150
             C295,175 290,195 275,215
             C310,225 320,215 335,205
             C345,198 345,175 330,150
             Z"/>

    <!-- back arm reaching forward -->
    <path d="M300,158
             C270,168 250,180 225,175
             C222,168 224,158 232,155
             C258,150 282,148 300,150
             Z"/>

    <!-- front arm swinging back -->
    <path d="M320,165
             C345,178 360,200 378,205
             C382,197 380,187 372,180
             C355,165 335,158 320,158
             Z"/>

    <!-- front leg, knee driving up -->
    <path d="M290,205
             C270,215 262,238 268,262
             C280,262 292,258 296,245
             C305,228 300,212 290,205
             Z"/>
    <!-- front shin + foot -->
    <path d="M270,258
             C255,270 240,278 218,278
             C216,270 220,262 228,258
             C245,250 262,250 270,258
             Z"/>

    <!-- back leg extended behind -->
    <path d="M310,210
             C335,225 355,240 372,262
             C365,270 353,272 344,266
             C325,252 308,232 300,215
             Z"/>
    <!-- back foot -->
    <path d="M360,258
             C378,262 393,258 402,246
             C396,239 386,236 376,239
             C366,242 360,250 360,258
             Z"/>
  </g>
</svg>
